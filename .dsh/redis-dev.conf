# 本地开发用 Redis 配置（Windows，D:\Redis\5.0.14.1）
# 用途：为 EducationSystem 提供登录 token 存储与 AI 危险操作待确认暂存（PendingActionStore）
#
# 启动：D:\Redis\5.0.14.1\redis-server.exe .dsh\redis-dev.conf

port 6379
bind 127.0.0.1

# 本地开发不需要持久化，避免在 Windows 上产生 RDB/AOF 文件
save ""
appendonly no

# 内存上限，防止本地开发时无界增长
maxmemory 256mb
maxmemory-policy allkeys-lru

loglevel notice
