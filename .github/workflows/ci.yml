# CI：把"手工敲的验证命令"变成每次 push 自动跑的门禁
#
# 设计取舍（为什么长这样）：
#   1. **只跑不依赖"真模型"的部分** —— 305 项后端测试 + 隐私 41 / 工具面 39 / 会话 31 三套断言
#      + 前端类型检查。**模型用 `.dsh/fake-model.cjs` 顶替**：它只会照抄收到的历史，
#      因此 CI 里每条"需要回答"的断言都变成确定性的（失败必然意味着链路坏了，而不是"今天模型心情不同"）。
#      需要**真实模型**才能测的东西（工具路由准确率、制度问答忠实度）**故意不进 CI**：
#      它们由本机的 `.dsh/eval-rag.cjs` / `.dsh/eval-p5-tools.cjs` 负责，并要求机器上有 Ollama。
#   2. **一个 job 顺序跑**，而不是拆成多个 job 并行：日志集中在一个地方，排查更方便
#      （这个项目吃过"多处并发写同一个库互相干扰"的亏，见开发记录里批次迁移那几轮）。
#   3. MySQL 用 service 容器，启动后**显式导入**建表与种子数据：测试里的夹具依赖种子数据，
#      不导入就会出现一堆"课程表为空"式的失败。
#   4. pgvector 也起容器但**不启用 RAG**：默认 `AI_RAG_ENABLED=false`，
#      既证明"关掉 RAG 时应用完全不碰 PostgreSQL"，也让 CI 不依赖向量索引构建（省几分钟）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: edujwxt
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p123456"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 测试夹具依赖种子数据（课程/学生/成绩/评价/考试…），必须先导入
      # ⚠️ 必须显式给库名：edujwxt.sql 是 Navicat 导出的**纯 DDL**（没有 CREATE DATABASE / USE），
      # 本地是 mysql -uroot -p 进去后先 use 库，CI 里没有这一步 ——
      # 首次运行就在第 23 行（DROP TABLE IF EXISTS `clazz`）报 ERROR 1046 No database selected。
      - name: Import schema and seed data
        run: |
          sudo apt-get install -y mysql-client >/dev/null 2>&1 || true
          mysql -h 127.0.0.1 -uroot -p123456 edujwxt < edujwxt.sql
          mysql -h 127.0.0.1 -uroot -p123456 edujwxt < seed_data.sql
          for f in docs/sql/*.sql; do
            echo ">> applying $f"
            mysql -h 127.0.0.1 -uroot -p123456 edujwxt < "$f" || true
          done

      # ① 后端全量测试（默认跳过需要真实模型的用例）
      # ⚠️ 期望数字必须跟着测试数一起改：写死数字时新增测试会让这一步的**名字**变成谎话
      # （数字只写在名字里，不参与判定——真正的判定是 mvn 的退出码）。
      - name: Backend tests (expect 312 passed, 6 skipped)
        working-directory: backend/edu-system-server
        run: mvn -B test -pl edu-api -am

      # ② 前端类型检查（vue-tsc strict）。放在这里而不是另开 job：本仓库的取舍是
      #    "一个 job 顺序跑、日志集中"，类型错误本来也该在合并前拦住。
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/edu-system-client/package-lock.json

      - name: Frontend type check (vue-tsc)
        working-directory: frontend/edu-system-client
        run: |
          npm ci
          npm run type-check

      # ③ 起后端（背后是④那个不会真思考的假模型），跑三套断言脚本
      - name: Package backend
        working-directory: backend/edu-system-server
        run: mvn -B package -DskipTests -pl edu-api -am

      # ④ 起一个**确定性的假模型**（OpenAI 兼容的 SSE 小服务）。
      #    没有它，CI 里任何"需要模型回答"的断言都只能关掉 —— 那样 CI 只证明"没报错"，
      #    而不是"这条链路能用"。实测教训：会话脚本即使带 --no-llm 也会发真实对话请求，
      #    无模型时助手侧按设计不落库，于是它在本机（有 Ollama）绿、在 CI 红。
      #    接上假模型后，会话脚本可以跑**强断言**（多轮落库、落库正文干净、记忆真的进了提示词）。
      - name: Start fake model (deterministic LLM stub)
        run: |
          node .dsh/fake-model.cjs > fake-model.log 2>&1 &
          up=0
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null -X POST http://127.0.0.1:11435/v1/chat/completions \
                 -H 'Content-Type: application/json' -d '{"messages":[]}'; then
              echo "fake model up after ${i}s"; up=1; break
            fi
            sleep 1
          done
          if [ "$up" != "1" ]; then
            echo "::error::fake model did not start within 20s"
            cat fake-model.log
            exit 1
          fi

      - name: Start backend
        working-directory: backend/edu-system-server/edu-api/target
        env:
          # 指向上面那个假模型：CI 不依赖任何真实模型/API Key
          AI_BASE_URL: http://127.0.0.1:11435/v1
          AI_API_KEY: stub-key
          AI_MODEL: fake-model
          # M4：MCP server 默认关闭，这里显式打开以验证它（无需模型，纯协议 + 工具面）
          AI_MCP_ENABLED: 'true'
        run: |
          nohup java -jar edu-api-0.0.1-SNAPSHOT.jar > backend.log 2>&1 &
          up=0
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8080/login -X POST \
                 -H 'Content-Type: application/json' -d '{"username":"2023001","password":"123456"}'; then
              echo "backend up after ${i}s"; up=1; break
            fi
            sleep 1
          done
          # 起不来就必须在这一步红：否则后面三套断言脚本会以"连不上/数据不对"的形式失败，
          # 排查时得先把日志翻一遍才知道根因是启动失败。
          if [ "$up" != "1" ]; then
            echo "::error::backend did not start within 60s"
            tail -100 backend.log
            exit 1
          fi

      - name: Assertions — tool surface (expect 39/39)
        run: node .dsh/eval-p5-tools.cjs --inventory-only

      - name: Assertions — privacy & audit log (expect 41/41)
        shell: pwsh
        env:
          EDU_MYSQL_CLIENT: mysql
          # CI 的 MySQL 是容器、只把 3306 发布到 127.0.0.1，runner 上没有本地 socket：
          # 客户端必须显式指定 host，否则脚本里每个 Sql 探针都返回空，
          # 失败会以"id 取不到 -> JSON 体畸形 -> HTTP 400"这种极具误导性的形式出现。
          EDU_MYSQL_ARGS: -h 127.0.0.1
        run: ./.dsh/verify-privacy.ps1

      # 强断言模式（不带 --no-llm）：假模型会回答，因此"助手回复也落库""多轮记忆真的进了提示词"
      # 这些断言在 CI 里是真跑的。脚本判据里的 31 项含这批强断言。
      - name: Assertions — conversations (expect 31/31)
        run: node .dsh/verify-m2-conversations.cjs

      # M4：MCP server 的协议级验证（SSE 握手 → tools/list → tools/call + 越权拒绝 + 审计留痕）。
      # 不需要模型；它证明外部 MCP 客户端真的能连上并调到工具，而单测只能证明"暴露策略算得对"。
      # 断言条数不写死：本地沙箱下读库的两条会 SKIP（沙箱拒绝 Node 抓子进程输出），
      # CI 里 mysql 可用，它们会真跑 —— 所以判定口径是"FAIL 必须为 0"。
      - name: Assertions — MCP server (expect 0 FAIL)
        env:
          EDU_MYSQL_CLIENT: mysql
          EDU_MYSQL_ARGS: -h 127.0.0.1
        run: node .dsh/verify-mcp.cjs

      - name: Backend log on failure
        if: failure()
        run: |
          tail -200 backend/edu-system-server/edu-api/target/backend.log || true
          echo "----- fake model log -----"
          tail -50 fake-model.log || true


